name: DSP and memory safety
# Guenstiger Linux-Lauf ohne JUCE: die Klang-Engine mit Speicher- und Fehlerpruefern (AddressSanitizer, UndefinedBehaviorSanitizer)
on:
  push:
    branches: [main]
    paths: ['Source/**', 'Tests/**', 'tools/**', 'scripts/**', 'CMakeLists.txt', 'VERSION', '.github/workflows/tests.yml']
  pull_request:
    branches: [main]
    paths: ['Source/**', 'Tests/**', 'tools/**', 'scripts/**', 'CMakeLists.txt', 'VERSION', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -DENGINE_ONLY=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  processor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JUCE- und Display-Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libxrender-dev xvfb xauth
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Prozessor und Engine bauen
        run: cmake --build build --target ProcessorTests EngineTests VoiceLeadingTests --parallel 2
      - name: MIDI-, GUI- und C-Heap-Regressionen
        run: xvfb-run -a ctest --test-dir build --output-on-failure
